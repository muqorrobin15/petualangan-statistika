<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Statistika</title>
<style>
:root{--bg:#fdf0c8;--card:#fffaf0;--tx:#0b3a4a;--ac:#0f766e;--gold:#f5b82e;--sea:#0e3a5c;--bad:#c0392b;--ok:#1e8e4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f33;--card:#12304d;--tx:#f3e9c6;--ac:#14b8a6;--sea:#0a2a47}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.top b{background:var(--gold);color:#3b2a00;padding:6px 12px;border-radius:20px}
.tg{border:2px solid var(--ac);background:transparent;color:var(--tx);border-radius:16px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;margin-left:4px}
.tg.off{opacity:.55;text-decoration:line-through}
h1,h2,h3{margin:6px 0}h1{font-size:30px;color:var(--gold);text-align:center}
.card{background:var(--card);border:2px dashed var(--ac);border-radius:16px;padding:14px;margin:10px 0}
.sea{background:var(--sea);color:#f3e9c6;border-radius:18px;padding:16px 10px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:bold;font-size:17px;padding:13px;margin:8px 0;cursor:pointer}
.btn.g{background:var(--gold);color:#3b2a00}.btn.l{background:transparent;color:var(--tx);border:2px solid var(--ac)}
.btn:active{transform:scale(.97)}
.isl{display:flex;flex-direction:column;align-items:center;margin:10px 0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.isl:nth-child(even){align-self:flex-end;margin-right:12%}.isl:nth-child(odd){align-self:flex-start;margin-left:12%}
.isl .c{width:84px;height:62px;border-radius:50%;background:#2f9e57;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #e9d28a}
.isl.lock .c{background:#6b7a86;filter:grayscale(1)}.isl.lock{cursor:not-allowed}
.map{display:flex;flex-direction:column}
.cap{width:64px;height:64px;flex:none}
.say{display:flex;gap:10px;align-items:center}.say p{margin:0;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:8px 12px}
.fm{background:var(--sea);color:#ffe9a0;border-radius:12px;padding:12px;text-align:center;font-size:18px;font-weight:bold;margin:10px 0}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--ac);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;margin:8px 0;font:inherit;font-size:17px;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.hud{display:flex;justify-content:space-between;font-size:20px}
.stars{font-size:46px;text-align:center;letter-spacing:6px}
.st{margin:6px 0;padding:8px;border-radius:10px;background:var(--card);border-left:5px solid var(--gold)}
.sm{font-size:13px;opacity:.85;text-align:center}
.bounce{animation:b .5s}@keyframes b{50%{transform:translateY(-10px)}}
.shake{animation:s .4s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tg:disabled{opacity:.4;cursor:not-allowed}.tools{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tools .tg{margin:0}.opt.hd{opacity:.25;pointer-events:none;text-decoration:line-through}

.qh{display:flex;justify-content:space-between;align-items:center;background:var(--sea);color:#f3e9c6;border-radius:14px;padding:8px 14px;font-weight:bold;font-size:17px}
.pb{height:10px;background:rgba(0,0,0,.2);border-radius:6px;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f5b82e,#ffdf7a);transition:width .4s}
.scroll{background:linear-gradient(#f8e9bd,#ecd391);color:#3b2a12;border:3px solid #b8863a;border-radius:14px;padding:20px 16px 14px;margin:18px 0 12px;box-shadow:0 4px 0 #8a6224;position:relative;animation:in .4s;font-size:17px}
.scroll p{margin:0}.scroll .tag{position:absolute;top:-13px;left:14px;background:#b8863a;color:#fff;font-size:13px;padding:2px 12px;border-radius:10px;font-weight:bold}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{background:#0e3a5c;color:#ffe9a0;border-radius:10px;padding:6px 11px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pts{position:absolute;right:14px;top:-16px;font-size:24px;font-weight:bold;color:#1e8e4e;background:#fff;border-radius:12px;padding:0 10px;animation:up 1.2s forwards}@keyframes up{to{transform:translateY(-22px);opacity:0}}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.opt{display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .1s;animation:in .4s}.opt:hover{transform:translateY(-2px)}.opt .l{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3b2a00;display:flex;align-items:center;justify-content:center;flex:none}.opt span{flex:1}.opt.ok .l,.opt.no .l{background:#fff;color:#222}.opt.no{animation:s .4s}
.hero{background:linear-gradient(#0b1f44,#1d6fa5);color:#f3e9c6;border-radius:18px;padding:22px 16px;text-align:center;margin:8px 0;overflow:hidden}.hero h1{margin:4px 0}.hero h2{margin:8px 0;color:var(--gold)}.hero p{margin:10px 0;font-size:17px}.hero .cap{width:110px;height:110px}.boat{font-size:76px;line-height:1.1}
.float{animation:fl 3s ease-in-out infinite;display:inline-block}@keyframes fl{50%{transform:translateY(-8px) rotate(2deg)}}
.fi{opacity:0;animation:fi .7s forwards}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.tw{animation:tw 1.6s infinite}@keyframes tw{50%{opacity:.3}}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.menu .btn{font-size:15px;padding:12px 4px;margin:0}
#cf{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.stars .sp{display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.champ{position:relative;text-align:center;background:radial-gradient(circle at 50% 30%,#3b2a00,#0b1f44 70%);color:#fff2c0;border-radius:20px;padding:26px 14px;overflow:hidden;border:3px solid #f5b82e;box-shadow:0 0 30px rgba(245,184,46,.5)}
.champ>*{position:relative}.champ h1{font-size:34px;letter-spacing:2px;margin:6px 0;background:linear-gradient(#fff6c8,#f5b82e);-webkit-background-clip:text;background-clip:text;color:transparent}.champ h2{margin:4px 0;color:#fff}.champ p{margin:8px 0}
.rays{position:absolute!important;left:50%;top:80px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(245,184,46,.28) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 70%);mask-image:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.trophy{font-size:110px;line-height:1;filter:drop-shadow(0 0 22px #f5b82e);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both,glow 2s ease-in-out 1s infinite}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}@keyframes glow{50%{transform:scale(1.08);filter:drop-shadow(0 0 40px #ffe27a)}}
.crown{font-size:34px;margin-top:-6px}.rank{display:inline-block;background:linear-gradient(#ffe27a,#f5b82e);color:#3b2a00;font-weight:bold;padding:8px 18px;border-radius:24px;margin:8px 0;box-shadow:0 3px 0 #8a6224}
.medals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.medal{background:rgba(255,255,255,.1);border:2px solid rgba(245,184,46,.6);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px}.medal span{font-size:28px}.score{font-size:18px;margin-top:6px}
.tbw{height:12px;background:rgba(0,0,0,.2);border-radius:8px;overflow:hidden;margin:6px 0}#tb{height:100%;background:linear-gradient(90deg,#2ecc71,#f5b82e);transition:width .1s linear}
.in{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ac);font:inherit;font-size:18px;text-align:center;background:var(--card);color:var(--tx);margin:8px 0}
</style></head><body><div id="app"></div>
<script>
/* ===== Audio (Web Audio API, tanpa berkas luar) ===== */
let AC,MG,SG,tm=null,bar=0;

function measure(){if(!AC)return;const t=AC.currentTime+.05,i=bar%8;bar++;tone(hz(BAS[i]),t,.9,"triangle",MG,1.2);tone(hz(BAS[i]+12),t+.5,.4,"sine",MG,.5);tone(hz(BAS[i]+12),t+1,.4,"sine",MG,.5);

const CH=[{r:-24,c:[-12,-9,-5]},{r:-28,c:[-16,-12,-9]},{r:-21,c:[-9,-5,-2]},{r:-26,c:[-14,-10,-7]}],IM=[[[0,3,1.8],[2,7,1.8]],[[0,8,1.8],[2,5,1.8]],[[0,7,1.8],[2,3,.9],[3,5,.9]],[[0,2,1.8],[2,5,1.8]]],SM=[[7,null,7,10,12,null,10,7],[8,null,8,12,15,null,12,8],[7,null,7,10,15,null,10,7],[5,null,2,5,10,null,5,2]];

const THo={
intro:{d:3.6,f(t,i){const h=CH[i%4];h.c.forEach(n=>tone(hz(n),t,3.5,'sine',MG,.35));tone(hz(h.r),t,1.6,'triangle',MG,1.1);tone(hz(h.r),t+1.8,1.6,'triangle',MG,.9);[0,1,2,1,0,1,2,1].forEach((k,j)=>tone(hz(h.c[k]+12),t+j*.45,.7,'triangle',MG,.55));IM[i%4].forEach(([b,n,dd])=>tone(hz(n),t+b*.9,dd,'sine',MG,.9));noise(t,3,.05,600)}},
map:{d:1.5,f(t,i){i%=8;tone(hz(BAS[i]),t,.9,'triangle',MG,1.2);tone(hz(BAS[i]+12),t+.5,.4,'sine',MG,.5);tone(hz(BAS[i]+12),t+1,.4,'sine',MG,.5);MEL[i].forEach((n,k)=>{if(n!==null)tone(hz(n),t+k*.5,i===7?1.4:.45,'triangle',MG,.9)})}},
sail:{d:1.6,f(t,i){const h=CH[i%4],m=SM[i%4];for(let j=0;j<8;j++){const tt=t+j*.2;tone(hz(h.r+(j%2?12:0)),tt,.15,'square',MG,.32);if(m[j]!==null)tone(hz(m[j]),tt,.2,'square',MG,.3);noise(tt,.04,.05,7000)}[0,2].forEach(b=>kick(t+b*.4));[1,3].forEach(b=>noise(t+b*.4,.12,.18,1800))}},
storm:{d:1.4,f(t,i){const B=[-24,-24,-12,-24,-24,-23,-12,-24],M=[12,15,18,15];for(let j=0;j<8;j++){tone(hz(B[j]),t+j*.175,.15,'sawtooth',MG,.45);noise(t+j*.175,.03,.06,7000)}[0,1,2,3].forEach(b=>{kick(t+b*.35);tone(hz(M[b]),t+b*.35,.3,'square',MG,.3)});[1,3].forEach(b=>noise(t+b*.35,.14,.22,1500))}},
quiz:{d:2.4,f(t,i){const h=CH[i%4],o=(i%8>=4)?12:0;[0,1,2,1,2,1,0,1].forEach((k,j)=>tone(hz(h.c[k]+12+o),t+j*.3,.18,'sine',MG,.8));[0,2].forEach(b=>tone(hz(h.r),t+b*.6,.35,'triangle',MG,1.1));[0,1,2,3].forEach(b=>noise(t+b*.6,.02,.05,5000))}}};
const CX={Am:{r:-24,c:[-12,-9,-5]},F:{r:-28,c:[-16,-12,-9]},C:{r:-21,c:[-9,-5,-2]},G:{r:-26,c:[-14,-10,-7]},Dm:{r:-19,c:[-7,-4,0]},E:{r:-29,c:[-17,-13,-10]}};
const PS=['Am','F','C','G','Am','Dm','E','E'],PQ=['C','Am','F','G','C','Am','Dm','G'],PM=['Am','Am','G','G','Am','F','E','Am'],BP=[0,0,12,0,0,12,7,12];

map:{d:1.5,f(t,i){THo.map.f(t,i);const h=CX[PM[i%8]];kick(t);[.5,1].forEach(b=>{noise(t+b,.06,.12,2000);h.c.forEach(n=>tone(hz(n+12),t+b,.3,'triangle',MG,.28))})}},
sail:{d:1.6,f(t,i){const b=i%8,h=CX[PS[b]],m=SA[b];for(let j=0;j<8;j++){const tt=t+j*.2;tone(hz(h.r+BP[j]),tt,.16,'square',MG,.32);if(m[j]!==null){tone(hz(m[j]),tt,.2,'square',MG,.28);if(b>3)tone(hz(m[j]-12),tt,.2,'sawtooth',MG,.12)}noise(tt,.04,j%2?.03:.07,7000);if(j%2)tone(hz(h.c[j%3]+12),tt,.08,'triangle',MG,.2)}kick(t);kick(t+.8);if(b%2)kick(t+.5);[.4,1.2].forEach(q=>noise(t+q,.12,.2,1800));if(b===7)for(let j=0;j<4;j++)noise(t+1.2+j*.1,.08,.2,1800)}},
quiz:{d:2.4,f(t,i){const b=i%8,h=CX[PQ[b]],m=QM[b];m.forEach((n,j)=>{if(n!==null){tone(hz(n),t+j*.3,.2,'sine',MG,.9);tone(hz(n+12),t+j*.3,.1,'triangle',MG,.25)}if(j%2)noise(t+j*.3,.03,.05,6000)});[0,1.2].forEach(k=>tone(hz(h.r),t+k,.4,'triangle',MG,1.1));[.6,1.8].forEach(k=>{tone(hz(h.r+7),t+k,.3,'triangle',MG,.8);noise(t+k,.08,.07,1800)})}}};
const CZ={Dm:{r:-31,c:[-19,-16,-12]},Bb:{r:-23,c:[-11,-7,-4]},F:{r:-28,c:[-16,-12,-9]},C:{r:-33,c:[-21,-17,-14]},A:{r:-24,c:[-12,-8,-5]},Gm:{r:-26,c:[-14,-11,-7]}};
const PI=['Dm','Bb','F','C','Dm','Bb','Gm','A'],PN=['Dm','F','C','Gm','Dm','Bb','C','A'];
const HI=[[[0,5,3],[3,8,1]],[[0,8,2],[2,5,1],[3,1,1]],[[0,12,3],[3,10,1]],[[0,7,2],[2,10,2]],[[0,17,3],[3,15,1]],[[0,13,2],[2,12,1],[3,8,1]],[[0,10,2],[2,13,2]],[[0,16,2],[2,12,2]]];
const HM=[[[0,5,2],[2,8,1],[3,7,1]],[[0,8,2],[2,12,2]],[[0,10,1],[1,7,1],[2,3,2]],[[0,5,2],[2,1,2]],[[0,12,2],[2,8,1],[3,5,1]],[[0,13,2],[2,12,1],[3,8,1]],[[0,10,2],[2,7,2]],[[0,12,3],[3,16,1]]];
function glide(a,b,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(a,t);o.frequency.linearRampToValueAtTime(b,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
TH.intro={d:2.67,f(t,i){const b=i%8,h=CZ[PI[b]],B=.667;
h.c.forEach(n=>{tone(hz(n),t,2.7,'triangle',MG,.3);tone(hz(n+12),t,2.7,'sine',MG,.2)});

HI[b].forEach(([k,n,dd])=>{tone(hz(n),t+k*B,dd*B,'triangle',MG,.8);tone(hz(n-12),t+k*B,dd*B,'sawtooth',MG,.18)});

TH.map={d:2.4,f(t,i){const b=i%8,h=CZ[PN[b]],B=.6;
[0,1,2,1,0,1,2,1].forEach((k,j)=>tone(hz(h.c[k]+12),t+j*.3,.5,'triangle',MG,.5));
tone(hz(h.r),t,1.1,'triangle',MG,1.1);tone(hz(h.r+7),t+1.2,1.1,'triangle',MG,.8);
HM[b].forEach(([k,n,dd])=>tone(hz(n),t+k*B,dd*B,'sine',MG,.75));
noise(t,2.3,.035,500);if(b%4===0){tone(hz(24),t+1.2,1.2,'sine',MG,.35);tone(hz(36.1),t+1.2,.8,'sine',MG,.12)}}};
const PC=['Dm','Bb','Gm','A','Dm','F','C','A'],BP2=[0,0,12,0,0,12,0,7];
const LC=[[12,null,12,10,8,null,10,12],[13,null,13,12,10,null,8,10],[10,null,13,12,10,null,8,5],[7,null,12,null,16,null,12,7],[17,null,15,12,17,null,15,12],[15,null,12,8,12,null,15,17],[19,null,15,10,15,null,19,22],[16,null,19,null,16,12,null,null]];
function cel(f,t,d,v){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.5,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);lp.connect(g);g.connect(MG);[1,1.005].forEach(k=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f*k;o.connect(lp);o.start(t);o.stop(t+d+.05)})}
const cs=(e,full)=>({d:e*8,f(t,i){const b=i%8,h=CZ[PC[b]],m=LC[b];
for(let j=0;j<8;j++){const tt=t+j*e;cel(hz(h.r+BP2[j]),tt,e*.95,.9);if(m[j]!==null)cel(hz(m[j]),tt,e*(m[j+1]===null&&j<7?1.9:.95),.55);

pusat:()=>`<h2>📖 Pusat Materi</h2><p class="sm">Baca ulang definisi, rumus, dan contoh kapan saja.</p>${IS.map((c,i)=>`<button class="btn ${i+1>s.un?"l":""}" onclick="openIs(${i},'pusat')">${c.ic} ${c.n}${i+1>s.un?" 🔒":""}</button>`).join("")}<button class="btn l" onclick="go('map')">⬅ Kembali ke peta</button><button class="btn l" onclick="s.ws=1;go('start')">🏠 Menu Awal</button>`,
materi:()=>{const c=IS[s.cur];return`<h2>${c.ic} Pulau ${s.cur+1}: ${c.n}</h2><div class="card">${c.def}</div><div class="fm">${c.f}</div>
<div class="card"><b>Contoh soal</b><br>${c.ex.q}${c.ex.st.slice(0,s.step).map((t,i)=>`<div class="st"><b>Langkah ${i+1}.</b> ${t}</div>`).join("")}</div>
${s.step<3?`<button class="btn g" onclick="nextStep()">Langkah ${s.step+1} ➜</button>`:`<button class="btn" onclick="sail()">⛵ Berlayar ke Kuis</button>`}
<button class="btn l" onclick="go('${s.back}')">⬅ Kembali</button>`},
juara:()=>{const ts=s.st.reduce((a,b)=>a+b,0),rk=ts>=12?['Kapten Legendaris','👑']:ts>=9?['Kapten Pemberani','⚔️']:['Pelaut Tangguh','⚓'];
return`<div class="champ"><div class="rays"></div><div class="trophy">🏆</div><div class="crown fi" style="animation-delay:.5s">${rk[1]}</div><h1 class="fi" style="animation-delay:.8s">SANG JUARA!</h1><h2 class="fi" style="animation-delay:1.2s">Kapten ${nm()}</h2><p class="fi" style="animation-delay:1.6s">Semua pulau berhasil ditaklukkan dan Peti Harta Statistika terbuka!</p><div class="rank fi" style="animation-delay:2s">${rk[1]} ${rk[0]}</div>
<div class="medals fi" style="animation-delay:2.4s">${IS.map((c,i)=>`<div class="medal"><span>${c.ic}</span><b>${c.n}</b><small>${'⭐'.repeat(s.st[i])+'☆'.repeat(3-s.st[i])}</small></div>`).join('')}</div><div class="score fi" style="animation-delay:2.8s">Total poin <b>${s.score}</b> · Bintang <b>${ts}/12</b></div></div>
<button class="btn g fi" style="animation-delay:3.2s" onclick="sfx('win');party(1)">🎆 Rayakan lagi</button><button class="btn l" onclick="go('map')">🗺 Kembali ke peta</button><button class="btn l" onclick="again()">🔁 Main dari awal</button>`},
sail:()=>{const o=s.sl,T=o.tools;
if(o.fail)return`<h2 style="text-align:center">🌊 Kapal tenggelam</h2>${say("sad","Kapalmu rusak diterjang rintangan. Coba lagi!")}<button class="btn g" onclick="sail()">🔁 Coba berlayar lagi</button><button class="btn l" onclick="startQ()">Lanjut ke kuis tanpa alat</button>`;
if(o.done)return`<h2 style="text-align:center">🏝️ Pulau ${IS[s.cur].n} tercapai!</h2><div class="card"><b>Alat yang kamu bawa:</b><br>🧭 Kompas ×${T.k}<br>🛟 Pelampung ×${T.p}<br>🔭 Teropong ×${T.t}</div>${say("happy","Alat siap dipakai di kuis!")}<button class="btn g" onclick="startQ()">🎯 Mulai Kuis</button>`;
if(!o.go)return`<h2>🌊 Seberangi Lautan</h2><div class="card">Geser kapal ke kiri dan kanan (sentuh atau geser layar, tombol ◀ ▶, atau tombol panah) selama sekitar 28 detik. Hindari 🪨 🌀 🦈: tiga tabrakan membuat kapal tenggelam. Meriam menembak otomatis saat ada sasaran tepat di depan kapal, atau tekan 💥 (spasi) untuk menembak sendiri. Tembak batu karang, hiu, perahu penyerang, dan kapal musuh; rangkai tembakan beruntun untuk kombo poin! Awas, pusaran menarik kapalmu, badai datang di akhir, dan kapal bajak laut musuh akan menembakimu: tembak 3 kali untuk menenggelamkannya! Semakin jauh pulaunya, semakin cepat dan panjang pelayarannya. Di kuis, tiap soal punya batas waktu. Ambil ⚡ untuk melaju kencang dan kebal selama 5 detik. Ada juga gerbang karang: cari celahnya!<br><br><b>Kumpulkan alat untuk kuis:</b><div class="st">🧭 Kompas: hilangkan 2 jawaban salah</div><div class="st">🛟 Pelampung: satu jawaban salah tidak mengurangi nyawa</div><div class="st">🔭 Teropong: tampilkan petunjuk rumus</div><div class="st">🪙 Koin: +5 poin</div></div><button class="btn g" onclick="sgo()">⛵ Berlayar!</button><button class="btn l" onclick="go('materi')">⬅ Kembali ke materi</button>`;
return`<canvas id="cv" class="cv" width="360" height="480"></canvas><div class="ctl"><button class="btn l" onpointerdown="K.l=1" onpointerup="K.l=0" onpointerleave="K.l=0" onpointercancel="K.l=0">◀</button><button class="btn g" onpointerdown="K.f=1" onpointerup="K.f=0" onpointerleave="K.f=0" onpointercancel="K.f=0">💥</button><button class="btn l" onpointerdown="K.r=1" onpointerup="K.r=0" onpointerleave="K.r=0" onpointercancel="K.r=0">▶</button></div>`},
kuis:()=>{const q=s.qs[s.qi],a=s.ans,ok=a!==null&&q.o[a]===q.a;
return`<div class="qh"><span>${hearts(s.lv)}</span><span>Soal ${s.qi+1} dari 5</span><span>🔥 ${s.sk}</span></div><div class="pb"><i style="width:${(s.qi+(a!==null?1:0))/5*100}%"></i></div><div class="tbw"><div id="tb" style="width:${Math.max(0,s.tt/s.tmax*100)}%"></div></div><div class="sm">⏱ ${Math.max(0,Math.ceil(s.tt))} detik · ⚡ jawab di separuh waktu pertama: bonus +5</div>
${tbar()}<div class="scroll"><span class="tag">📜 Misi ${s.qi+1}</span>${a!==null&&ok?`<span class="pts">+${s.lp}</span>`:""}${qt(q.t)}</div>${s.hint?`<div class="card">💡 Petunjuk: ${IS[s.cur].f}</div>`:""}${q.o.map((v,k)=>`<button class="opt ${s.hid.includes(k)?"hd":a!==null?(v===q.a?"ok":k===a?"no":""):""}" onclick="pick(${k})"><b class="l">${"ABCD"[k]}</b><span>${F(v)}</span>${a!==null?(v===q.a?"✅":k===a?"❌":""):""}</button>`).join("")}
${say(a===null?"think":ok?"happy":"sad",a===null?"Pilih jawabanmu, Kapten!":ok?"Mantap! Benar, poin bertambah"+(s.sk>1?" dengan bonus beruntun!":"."):((s.to?"⏰ Waktu habis! ":"")+(s.saved?"Salah, tapi pelampung menyelamatkan nyawamu!":"Aduh, salah! Nyawa berkurang satu.")))}
${a!==null?`<div class="card"><b>Pembahasan:</b> ${q.sol}</div><button class="btn g" onclick="nextQ()">${s.lv===0||s.qi===4?"Lihat hasil ➜":"Soal berikutnya ➜"}</button>`:""}`},
hasil:()=>{const r=s.res,c=IS[s.cur];return r.win?`<div class="hero"><div class="trophy" style="font-size:72px">🏅</div><h2>Pulau ${c.n} Tuntas!</h2><div class="stars">${[0,1,2].map(k=>`<span class="${k<r.stars?'sp':''}" style="animation-delay:${.6+k*.35}s">${k<r.stars?'⭐':'☆'}</span>`).join('')}</div></div>
<div class="card">Poin soal: <b>${s.got}</b><br>Bonus bintang: <b>+${r.bonus}</b> (${r.stars} × 20)</div>${say("happy",s.cur<3?"Pulau berikutnya sudah terbuka!":"Semua pulau selesai. Peti harta menantimu!")}
${s.cur<3?`<button class="btn g" onclick="openIs(${s.cur+1},'map')">Pulau berikutnya ➜</button>`:(s.st.every(x=>x>0)?`<button class="btn g" onclick="champ()">🏆 Buka Peti Harta!</button>`:"")}<button class="btn l" onclick="go('map')">🗺 Peta pulau</button>`
:`<h2 style="text-align:center">💀 Nyawa habis</h2><div class="stars">☆☆☆</div>${say("sad","Tenang, baca materinya lagi lalu coba ulang!")}<button class="btn g" onclick="openIs(${s.cur},'map')">📖 Baca materi lagi</button><button class="btn l" onclick="sail()">🔁 Ulangi level</button><button class="btn l" onclick="go('map')">🗺 Peta pulau</button>`}};
function chest(){if(!s.st.every(x=>x>0)){sfx("bad");return}champ()}
function champ(){s.chest=1;s.pf=1;s.sc='juara';sfx('win');setTimeout(()=>sfx('star'),800);render()}
function again(){s.score=0;s.un=1;s.st=[0,0,0,0];s.chest=0;go('map')}
let CF=0;
function party(big){const id=++CF;let cv=document.getElementById('cf');if(!cv){cv=document.createElement('canvas');cv.id='cf';document.body.appendChild(cv)}cv.width=innerWidth;cv.height=innerHeight;const c=cv.getContext('2d'),ps=[],col=['#f5b82e','#ff5a5f','#2ec4b6','#fff','#7ad7f0','#c77dff'];let t0=performance.now(),last=t0;
const burst=(X,Y)=>{const h=R(0,360);for(let k=0;k<40;k++){const a=k/40*6.283,v=R(80,220);ps.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.2,m:1.2,c:'hsl('+h+',100%,60%)',r:3,g:200})}};
for(let k=0;k<(big?140:80);k++)ps.push({x:R(0,innerWidth),y:R(-innerHeight,0),vx:R(-30,30),vy:R(120,260),l:99,m:99,c:col[R(0,5)],r:R(4,8),g:0,w:1,a:Math.random()*6});
const f=now=>{if(id!==CF||(s.sc!=='juara'&&s.sc!=='hasil')){if(id===CF)cv.remove();return}const dt=Math.min(.05,(now-last)/1000);last=now;const el=(now-t0)/1000;c.clearRect(0,0,cv.width,cv.height);
if(big&&el<9&&Math.random()<dt*1.6)burst(R(60,innerWidth-60),R(60,innerHeight*.5));
ps.forEach(p=>{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.w){p.a+=dt*8;if(p.y>innerHeight){if(el<6){p.y=-10;p.x=R(0,innerWidth)}else p.l=0}c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore()}else{p.l-=dt;c.globalAlpha=Math.max(0,p.l/p.m);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1}});
for(let i=ps.length-1;i>=0;i--)if(ps[i].l<=0)ps.splice(i,1);
if(ps.length||el<9)requestAnimationFrame(f);else cv.remove()};requestAnimationFrame(f)}
const CJ={D:{r:-31,c:[-19,-15,-12]},G:{r:-26,c:[-14,-10,-7]},A:{r:-24,c:[-12,-8,-5]},Bm:{r:-22,c:[-10,-7,-3]}},PJ=['D','G','A','A','Bm','G','A','D'];
const HJ=[[[0,5,1],[1,9,1],[2,12,2]],[[0,14,1],[1,12,1],[2,10,2]],[[0,12,1],[1,16,1],[2,19,2]],[[0,21,3],[3,19,1]],[[0,14,2],[2,17,2]],[[0,19,2],[2,17,1],[3,14,1]],[[0,16,1],[1,19,1],[2,21,2]],[[0,17,4]]];
TH.champ={d:1.846,f(t,i){const b=i%8,h=CJ[PJ[b]],B=.4615;
h.c.forEach(n=>tone(hz(n),t,1.9,'triangle',MG,.3));tone(hz(h.r),t,.9,'sawtooth',MG,.22);tone(hz(h.r),t,1.8,'sine',MG,1);
HJ[b].forEach(([k,n,dd])=>{tone(hz(n),t+k*B,dd*B,'sawtooth',MG,.3);tone(hz(n),t+k*B,dd*B,'triangle',MG,.6);tone(hz(n-12),t+k*B,dd*B,'sine',MG,.4)});
for(let j=0;j<8;j++)tone(hz(h.c[j%3]+24),t+j*B/2,.3,'sine',MG,.3);
kick(t);kick(t+2*B);if(b===7)for(let j=0;j<4;j++){kick(t+(3+j*.25)*B);noise(t+(3+j*.25)*B,.08,.2,1800)}else[1,3].forEach(q=>noise(t+q*B,.12,.2,1800));if(b===0)noise(t,1.5,.2,3000)}};
render();
</script></body></html>
